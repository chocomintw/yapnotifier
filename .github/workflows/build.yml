name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # the Release step creates the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check package.ini version matches version.h
        shell: pwsh
        run: |
          $h = (Select-String -Path shared/version.h -Pattern '#define YAP_VERSION\s+"([^"]+)"').Matches[0].Groups[1].Value
          $p = (Select-String -Path ts3plugin/package.ini -Pattern '^Version\s*=\s*(\S+)').Matches[0].Groups[1].Value
          if ($h -ne $p) { throw "version.h says $h but ts3plugin/package.ini says $p" }
          "version $h"

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/YapNotifier.asi, build/YapNotifier.ts3_plugin dist/
          Copy-Item build/Release/YapNotifier.pdb .   # CI artifact only, never released
          $sums = Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          @("## SHA-256", '```', $sums, '```') | Set-Content release-notes.md
          Get-Content release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: YapNotifier-${{ github.sha }}
          path: |
            dist/
            YapNotifier.pdb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
